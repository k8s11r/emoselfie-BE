[project]
name = "emoselfie-backend"
version = "0.1.0"
description = "Server-authoritative emotion selfie game backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-socketio>=5.12,<6",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5.2,<7",
  "pillow>=12.3,<13",
  "numpy>=2.2,<3",
]

[dependency-groups]
dev = [
  "aiohttp>=3.11,<4",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[project.optional-dependencies]
inference = ["torch==2.8.0", "mediapipe==0.10.35"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires migrated PostgreSQL and two Redis instances",
  "model: requires the inference extra and prepared model artifacts",
]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["app/inference/vendor/ryumina.py", "docs/poc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
exclude = ["app/inference/vendor/ryumina.py"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["socketio", "socketio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*", "app.inference.vendor.ryumina"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.uv]
package = false

# torch는 같은 버전에 CUDA 빌드와 CPU 빌드가 따로 있다. PyPI 기본값은 Linux
# x86_64에서 CUDA 빌드라 nvidia 패키지 14개(4.1GB)가 함께 설치되는데, 이
# 서버는 GPU를 쓰지 않으므로 전부 사용되지 않는다. Linux에서만 CPU 인덱스를
# 보게 한다. macOS 휠에는 애초에 CUDA가 없어 로컬 개발은 영향받지 않는다.
# BE-063.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
