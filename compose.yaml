name: emoselfie-be-dev
services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: emoselfie
      POSTGRES_PASSWORD: local-development
      POSTGRES_DB: emoselfie
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emoselfie -d emoselfie"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4.8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis-media:
    image: redis:7.4.8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:56380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres-data:
